name: Build, tests and SonarQube Cloud
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: Compilacion, pruebas y SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Preparar Node.js compatible con Angular 11
        uses: actions/setup-node@v4
        with:
          node-version: '12.22.12'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar el proyecto
        run: npm run build
      - name: Preparar Chrome y ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Ejecutar las pruebas E2E existentes
        run: npm run e2e -- --webdriver-update=false
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
      - name: Preparar Node.js para el analisis de SonarQube
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
